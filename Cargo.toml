[package]
name = "kanttiinit"
version = "0.3.1"
description = "Command-line interface for browsing restaurant menus from Kanttiinit.fi"
authors = ["Kanttiinit Contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Kanttiinit/cli"
homepage = "https://kanttiinit.fi"
documentation = "https://github.com/Kanttiinit/cli/blob/main/README.md"
readme = "README.md"
keywords = ["cli", "restaurant", "menu", "food", "kanttiinit"]
categories = ["command-line-utilities"]
rust-version = "1.70"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "kanttiinit"

[dependencies]
anyhow = "1.0.86"
chrono = "0.4.38"
clap = { version = "4.5.16", default-features = false, features = [
  "derive",
  "std",
  "help",
  "usage",
] }
serde = { version = "1.0.208", features = ["derive"] }
ureq = { version = "3.2.0", default-features = false, features = [
  "json",
  "rustls",
] }

[dev-dependencies]
serde_json = "1.0"

# https://github.com/johnthagen/min-sized-rust
[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
