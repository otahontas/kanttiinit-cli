name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  devenv:
    name: Devenv
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: cachix/cachix-action@v15
        with:
          name: devenv
      - name: Install devenv.sh
        run: nix profile install --accept-flake-config nixpkgs#devenv

      - name: Build shell
        run: devenv shell -- echo "Shell built"

      - name: Run tests
        run: devenv tasks run kanttiinit:test

      - name: Run lint
        run: devenv tasks run kanttiinit:lint

      - name: Run formatting check
        run: devenv tasks run kanttiinit:fmt:check

      - name: Run build
        run: devenv tasks run kanttiinit:build
