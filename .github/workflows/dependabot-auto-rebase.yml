name: Auto-rebase Dependabot PRs

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Update open Dependabot PRs
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --author "dependabot[bot]" --state open --json number --jq '.[].number' | while read -r pr; do
            echo "Updating PR #$pr..."
            gh api "repos/$GITHUB_REPOSITORY/pulls/$pr/update-branch" -X PUT || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
